<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>支付成功 - 拼团商城</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Vue 3 -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <!-- 图标库 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Animate.css -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        .success-bg {
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
            min-height: 100vh;
        }
        .success-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }
        .success-icon {
            animation: bounceIn 1s;
        }
        @keyframes floatAnimation {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        .floating {
            animation: floatAnimation 3s ease-in-out infinite;
        }
    </style>
</head>
<body>
    <div id="app" class="success-bg">
        <div class="container mx-auto px-4 py-16">
            <div class="max-w-md mx-auto">
                <div class="success-card p-8 animate__animated animate__fadeInUp">
                    <!-- 成功图标 -->
                    <div class="text-center mb-8">
                        <div class="success-icon inline-block p-6 rounded-full bg-green-100">
                            <i class="fas fa-check-circle text-6xl text-green-500"></i>
                        </div>
                    </div>

                    <!-- 成功信息 -->
                    <div class="text-center mb-8">
                        <h2 class="text-2xl font-bold text-gray-800 mb-4">支付成功</h2>
                        <p class="text-gray-600">您的订单已支付完成</p>
                        <div class="mt-4 text-green-600 font-semibold">
                            <span class="text-3xl">¥</span>
                            <span class="text-4xl">{{ orderAmount }}</span>
                        </div>
                    </div>

                    <!-- 订单信息 -->
                    <div class="bg-gray-50 rounded-lg p-4 mb-6">
                        <div class="flex justify-between mb-2">
                            <span class="text-gray-600">订单编号</span>
                            <span class="text-gray-800">{{ orderId }}</span>
                        </div>
                        <div class="flex justify-between">
                            <span class="text-gray-600">支付方式</span>
                            <span class="text-gray-800">{{ payMethod }}</span>
                        </div>
                    </div>

                    <!-- 按钮 -->
                    <div class="space-y-4">
                        <button @click="viewOrder" 
                                class="w-full py-3 bg-green-500 text-white rounded-full font-bold hover:bg-green-600 transition-all duration-300 transform hover:scale-105">
                            查看订单
                        </button>
                        <button @click="backToHome" 
                                class="w-full py-3 border-2 border-green-500 text-green-500 rounded-full font-bold hover:bg-green-50 transition-all duration-300">
                            返回首页
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const { createApp, onMounted } = Vue

        createApp({
            setup() {
                // 检查登录状态
                onMounted(() => {
                    const userType = localStorage.getItem('userType')
                    if (!userType) {
                        window.location.href = 'login.html'
                    }
                })

                const orderAmount = 299.00
                const orderId = 'DD' + Date.now()
                const payMethod = '微信支付'

                const viewOrder = () => {
                    // 查看订单详情
                    alert('订单详情功能开发中...')
                }

                const backToHome = () => {
                    window.location.href = 'index.html'
                }

                return {
                    orderAmount,
                    orderId,
                    payMethod,
                    viewOrder,
                    backToHome
                }
            }
        }).mount('#app')
    </script>
</body>
</html>
