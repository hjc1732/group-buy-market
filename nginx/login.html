<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 拼团商城</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Vue 3 -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <!-- FingerprintJS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fingerprintjs2/2.1.4/fingerprint2.min.js"></script>
    <!-- 图标库 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Animate.css -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        .login-bg {
            background: linear-gradient(135deg, #FF6B6B 0%, #FF4757 100%);
            min-height: 100vh;
            position: relative;
            overflow: hidden;
        }
        .login-bg::before {
            content: '';
            position: absolute;
            width: 150%;
            height: 150%;
            top: -25%;
            left: -25%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0) 60%);
            animation: rotate 20s linear infinite;
        }
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .login-card {
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.95);
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            transform: translateY(0);
            transition: all 0.3s ease;
        }
        .login-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
        }
        .btn-login {
            background: linear-gradient(45deg, #FF6B6B, #FF4757);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .btn-login::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: 0.5s;
        }
        .btn-login:hover::after {
            left: 100%;
        }
        .btn-guest {
            border: 2px solid #FF4757;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            z-index: 1;
        }
        .btn-guest::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 100%;
            background: rgba(255, 71, 87, 0.1);
            transition: 0.5s;
            z-index: -1;
        }
        .btn-guest:hover::before {
            width: 100%;
        }
        .floating {
            animation: float 6s ease-in-out infinite;
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
            100% { transform: translateY(0px); }
        }
        .scale-in {
            animation: scaleIn 0.5s ease-out;
        }
        @keyframes scaleIn {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .input-field {
            @apply w-full px-4 py-3 rounded-xl border border-gray-300 focus:border-red-500 focus:ring-2 focus:ring-red-200 transition-all duration-200 mb-4;
        }
    </style>
</head>
<body>
    <div id="app" class="login-bg">
        <div class="container mx-auto px-4 py-16">
            <div class="max-w-md mx-auto">
                <!-- Logo和标题 -->
                <div class="text-center text-white mb-8 animate__animated animate__fadeInDown">
                    <div class="floating">
                        <i class="fas fa-shopping-cart text-6xl mb-4"></i>
                    </div>
                    <h1 class="text-4xl font-bold mb-2">拼团商城</h1>
                    <p class="text-xl text-red-100">优惠多多，实惠多多</p>
                </div>

                <!-- 登录卡片 -->
                <div class="login-card p-8 scale-in">
                    <h2 class="text-2xl font-bold text-center mb-8">欢迎登录</h2>

                    <!-- 登录按钮区域 -->
                    <div class="space-y-4">
                        <!-- 系统登录按钮 -->
                        <button @click="systemLogin" 
                                class="btn-login w-full py-4 rounded-xl text-white font-bold flex items-center justify-center space-x-2 transform hover:scale-105">
                            <i class="fas fa-user text-xl"></i>
                            <span class="text-lg">系统登录</span>
                        </button>

                        <!-- 分割线 -->
                        <div class="flex items-center my-6">
                            <div class="flex-1 border-t border-gray-300"></div>
                            <div class="px-4 text-gray-500">或</div>
                            <div class="flex-1 border-t border-gray-300"></div>
                        </div>

                        <!-- 游客登录按钮 -->
                        <button @click="guestLogin" 
                                class="btn-guest w-full py-4 rounded-xl text-red-600 font-bold flex items-center justify-center space-x-2 transform hover:scale-105">
                            <i class="fas fa-user-secret text-xl"></i>
                            <span class="text-lg">游客登录</span>
                        </button>
                    </div>

                    <!-- 底部提示 -->
                    <div class="mt-8 text-center text-gray-500 text-sm">
                        登录即表示您同意
                        <a href="#" class="text-red-600 hover:text-red-700 transition-colors">用户协议</a>
                        和
                        <a href="#" class="text-red-600 hover:text-red-700 transition-colors">隐私政策</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const { createApp } = Vue

        createApp({
            setup() {
                const systemLogin = () => {
                    // 添加过渡动画
                    document.querySelector('.login-card').classList.add('animate__animated', 'animate__fadeOutUp')
                    setTimeout(() => {
                        window.location.href = 'system-login.html'
                    }, 500)
                }

                const guestLogin = () => {
                    // 添加过渡动画
                    document.querySelector('.login-card').classList.add('animate__animated', 'animate__fadeOutUp')
                    setTimeout(() => {
                        sessionStorage.setItem('userType', 'guest')
                        //获取浏览器指纹
                        if (typeof Fingerprint2 !== 'undefined') {
                            Fingerprint2.get(function(components) {
                                const values = components.map(function(component) {
                                    return component.value
                                })
                                const fingerprint = Fingerprint2.x64hash128(values.join(''), 31)
                                sessionStorage.setItem('username', fingerprint)
                                // 检查是否有重定向URL
                                const redirectUrl = localStorage.getItem('redirectUrl')
                                if (redirectUrl) {
                                    localStorage.removeItem('redirectUrl') // 清除重定向URL
                                    window.location.href = redirectUrl
                                } else {
                                    window.location.href = 'index.html'
                                }
                            })
                        } else {
                            console.error('FingerprintJS 库加载失败')
                            // 使用备用方案：生成随机ID
                            const randomId = 'guest_' + Math.random().toString(36).substr(2, 9)
                            sessionStorage.setItem('username', randomId)
                            window.location.href = 'index.html'
                        }
                    }, 500)
                }

                return {
                    systemLogin,
                    guestLogin
                }
            }
        }).mount('#app')
    </script>
</body>
</html>
