<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>确认订单 - 拼团商城</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Vue 3 -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <!-- 图标库 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .btn-primary {
            transition: all 0.3s ease;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.2);
        }
        .payment-option {
            transition: all 0.3s ease;
        }
        .payment-option:hover {
            transform: translateY(-2px);
        }
        .payment-option.selected {
            border-color: #ef4444;
        }
        .payment-option.selected .check-icon {
            display: block;
        }
    </style>
</head>
<body class="bg-gray-50">
    <div id="app" class="min-h-screen">
        <!-- 顶部导航栏 -->
        <nav class="bg-white shadow-lg fixed top-0 left-0 right-0 z-50">
            <div class="container mx-auto px-4 py-4">
                <div class="flex justify-between items-center">
                    <div class="text-xl font-bold text-gray-800 flex items-center">
                        <i @click="goBack" class="fas fa-arrow-left mr-3 cursor-pointer"></i>
                        <span>确认订单</span>
                    </div>
                </div>
            </div>
        </nav>

        <!-- 订单内容 -->
        <div class="container mx-auto px-4 pt-20 pb-32">
            <!-- 收货地址 -->
            <!-- <div class="bg-white rounded-lg p-4 mb-4">
                <div class="flex justify-between items-center">
                    <div>
                        <div class="font-bold mb-1">{{ address.name }} {{ address.phone }}</div>
                        <div class="text-gray-600 text-sm">{{ address.detail }}</div>
                    </div>
                    <i class="fas fa-chevron-right text-gray-400"></i>
                </div>
            </div> -->

            <!-- 商品信息 -->
            <div class="bg-white rounded-lg p-4 mb-4">
                <div class="flex items-start">
                    <img :src="product.image" :alt="product.name" class="w-24 h-24 object-cover rounded-lg">
                    <div class="ml-4 flex-1">
                        <h3 class="font-bold mb-2">{{ product.name }}</h3>
                        <p class="text-gray-600 text-sm mb-2">{{ product.description }}</p>
                        <div class="flex justify-between items-center">
                            <span class="text-red-600 font-bold">¥{{ orderType === 'group' ? product.groupPrice : product.originalPrice }}</span>
                            <span class="text-gray-500">x1</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 支付方式 -->
            <div class="bg-white rounded-lg p-4 mb-4">
                <h3 class="font-bold mb-4">支付方式</h3>
                <div class="space-y-4">
                    <div class="payment-option border rounded-lg p-4 flex justify-between items-center cursor-pointer"
                         :class="{ 'selected': paymentMethod === 'wechat' }"
                         @click="paymentMethod = 'wechat'">
                        <div class="flex items-center">
                            <i class="fab fa-weixin text-2xl text-green-500 mr-3"></i>
                            <span>微信支付</span>
                        </div>
                        <i class="fas fa-check text-red-600 check-icon" v-show="paymentMethod === 'wechat'"></i>
                    </div>
                    <div class="payment-option border rounded-lg p-4 flex justify-between items-center cursor-pointer"
                         :class="{ 'selected': paymentMethod === 'alipay' }"
                         @click="paymentMethod = 'alipay'">
                        <div class="flex items-center">
                            <i class="fab fa-alipay text-2xl text-blue-500 mr-3"></i>
                            <span>支付宝</span>
                        </div>
                        <i class="fas fa-check text-red-600 check-icon" v-show="paymentMethod === 'alipay'"></i>
                    </div>
                </div>
            </div>
        </div>

        <!-- 底部支付栏 -->
        <div class="fixed bottom-0 left-0 right-0 bg-white border-t p-4">
            <div class="flex justify-between items-center mb-4">
                <span class="text-gray-600">实付金额</span>
                <span class="text-2xl font-bold text-red-600">¥{{ orderType === 'group' ? product.groupPrice : product.originalPrice }}</span>
            </div>
            <button @click="pay" class="btn-primary bg-red-600 text-white w-full py-3 rounded-full text-lg">
                立即支付
            </button>
        </div>
    </div>

    <script>
        const { createApp, ref, onMounted } = Vue

        createApp({
            setup() {
                const paymentMethod = ref('wechat')
                const orderType = ref('')
                const groupId = ref('')
                const product = ref({
                    name: "",
                    description: "",
                    image: "",
                    originalPrice: 0,
                    groupPrice: 0,
                    targetCount: 0
                })
                const address = ref({
                    name: "张三",
                    phone: "13800138000",
                    detail: "北京市朝阳区xxx街道xxx小区"
                })

                // 获取商品详情
                const fetchProductDetail = async (goodsId, source, channel) => {
                    try {
                        const userId = sessionStorage.getItem('username')
                        if (!userId) {
                            alert('请先登录')
                            window.location.href = 'login.html'
                            return
                        }

                        const response = await fetch(`http://localhost:8091/api/v1/gbm/trade/ac-detail?userId=${userId}&source=${source}&channel=${channel}&goodsId=${goodsId}`)
                        const result = await response.json()

                        if (result.code === '0000' && result.data) {
                            const goods = result.data.goods
                            product.value = {
                                name: goods.goodsName,
                                description: goods.goodsDesc,
                                image: goods.goodsPic[0],
                                originalPrice: goods.originalPrice,
                                groupPrice: goods.payPrice,
                                targetCount: goods.targetCount
                            }
                        } else {
                            alert('获取商品信息失败：' + result.info)
                        }
                    } catch (error) {
                        console.error('获取商品详情失败：', error)
                        alert('获取商品信息失败，请稍后重试')
                    }
                }

                const goBack = () => {
                    window.history.back()
                }

                const pay = () => {
                    // 检查登录状态
                    const userType = sessionStorage.getItem('userType')
                    if (!userType) {
                        localStorage.setItem('redirectUrl', window.location.href)
                        window.location.href = 'login.html'
                        return
                    }

                    // 构建支付参数
                    const params = {
                        userId: sessionStorage.getItem('username'),
                        goodsId: product.value.id,
                        orderType: orderType.value,
                        paymentMethod: paymentMethod.value
                    }

                    if (orderType.value === 'join') {
                        params.groupId = groupId.value
                    }

                    // 发起支付请求
                    fetch('http://localhost:8091/api/v1/gbm/trade/pay', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(params)
                    })
                    .then(response => response.json())
                    .then(result => {
                        if (result.code === '0000') {
                            window.location.href = 'pay-success.html'
                        } else {
                            alert('支付失败：' + result.info)
                        }
                    })
                    .catch(error => {
                        console.error('支付请求失败：', error)
                        alert('支付失败，请稍后重试')
                    })
                }

                onMounted(() => {
                    // 获取URL参数
                    const urlParams = new URLSearchParams(window.location.search)
                    const productId = urlParams.get('id')
                    const source = urlParams.get('source')
                    const channel = urlParams.get('channel')
                    orderType.value = urlParams.get('type') || 'single'
                    groupId.value = urlParams.get('groupId')

                    // 获取商品信息
                    if (productId && source && channel) {
                        fetchProductDetail(productId, source, channel)
                    } else {
                        alert('参数不完整，请检查URL')
                    }
                })

                return {
                    paymentMethod,
                    orderType,
                    product,
                    address,
                    goBack,
                    pay
                }
            }
        }).mount('#app')
    </script>
</body>
</html>
