<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>支付成功 - 拼团商城</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Vue 3 -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <!-- 图标库 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .success-animation {
            animation: scaleIn 0.5s ease-out;
        }
        @keyframes scaleIn {
            from { transform: scale(0); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .btn-primary {
            transition: all 0.3s ease;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.2);
        }
    </style>
</head>
<body class="bg-gray-50">
    <div id="app" class="min-h-screen">
        <!-- 顶部导航栏 -->
        <nav class="bg-white shadow-lg fixed top-0 left-0 right-0 z-50">
            <div class="container mx-auto px-4 py-4">
                <div class="flex justify-between items-center">
                    <div class="text-xl font-bold text-gray-800">
                        支付成功
                    </div>
                </div>
            </div>
        </nav>

        <!-- 支付成功内容 -->
        <div class="container mx-auto px-4 pt-20">
            <div class="bg-white rounded-lg p-8 text-center">
                <div class="success-animation mb-6">
                    <i class="fas fa-check-circle text-6xl text-green-500"></i>
                </div>
                <h2 class="text-2xl font-bold text-gray-800 mb-4">支付成功</h2>
                <p class="text-gray-600 mb-8">您的订单已支付成功，感谢您的购买！</p>
                <div class="space-y-4">
                    <button @click="goToHome" class="btn-primary bg-red-600 text-white px-8 py-3 rounded-full text-lg w-full">
                        返回首页
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const { createApp } = Vue

        createApp({
            setup() {
                const goToHome = () => {
                    window.location.href = 'index.html'
                }

                return {
                    goToHome
                }
            }
        }).mount('#app')
    </script>
</body>
</html>
